name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github:
    uses: ./.github/workflows/github-release.yml
    with:
      generate: true
  npm:
    uses: ./.github/workflows/package-npm.yml
    with:
      generate: true
